<style>
:root{
  --ink:#050304; --cream:#f2e7cd; --blood:#9c1f24; --blood-hi:#d3262f;
  --gold:#c9a45c; --cold:#37424f;
  --fell:'IM Fell English SC','Times New Roman',serif;
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--ink);overflow:hidden}
body{font-family:var(--serif);color:var(--cream);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#bgm{display:none}

/* ---- film corner frames ---- */
.corner{position:fixed;width:58px;height:58px;border:0 solid rgba(201,164,92,.42);z-index:6}
.corner.tl{top:20px;left:20px;border-top-width:1px;border-left-width:1px}
.corner.tr{top:20px;right:20px;border-top-width:1px;border-right-width:1px}
.corner.bl{bottom:20px;left:20px;border-bottom-width:1px;border-left-width:1px}
.corner.br{bottom:20px;right:20px;border-bottom-width:1px;border-right-width:1px}
.corner::after{content:'';position:absolute;width:7px;height:7px;background:rgba(201,164,92,.6);transform:rotate(45deg)}
.corner.tl::after{top:-4px;left:-4px}.corner.tr::after{top:-4px;right:-4px}
.corner.bl::after{bottom:-4px;left:-4px}.corner.br::after{bottom:-4px;right:-4px}
@media(max-width:640px){.corner{display:none}}

/* ---- top bar ---- */
#topbar{position:fixed;top:16px;right:20px;display:flex;gap:9px;z-index:30}
.tbtn{pointer-events:auto;background:rgba(5,3,4,.45);border:1px solid rgba(156,31,36,.55);color:var(--gold);
  font-family:var(--fell);font-size:11px;letter-spacing:.2em;padding:8px 11px;cursor:pointer;transition:all .3s}
.tbtn:hover{box-shadow:0 0 14px rgba(211,38,47,.4);color:#ecd28a;border-color:var(--blood-hi)}
.tbtn.off{opacity:.4}
.tbtn.off span{text-decoration:line-through}
@media(max-width:640px){#topbar{top:10px;right:10px}.tbtn{font-size:10px;padding:6px 8px}}

/* ---- title block ---- */
#titleBlock{position:absolute;top:8.5%;left:0;right:0;text-align:center;transition:opacity .9s ease}
.title-main{font-weight:900;font-size:clamp(42px,7.6vw,92px);letter-spacing:.85em;text-indent:.85em;color:var(--cream);
  text-shadow:0 0 34px rgba(211,38,47,.32),0 2px 0 rgba(0,0,0,.6)}
.title-main.en{font-family:var(--fell);font-weight:400;letter-spacing:.3em;text-indent:.3em;font-size:clamp(34px,6vw,74px)}
.divider{display:flex;align-items:center;justify-content:center;margin:20px auto 0;width:min(380px,62vw)}
.divider::before,.divider::after{content:'';height:1px;flex:1}
.divider::before{background:linear-gradient(90deg,transparent,rgba(201,164,92,.75))}
.divider::after{background:linear-gradient(90deg,rgba(201,164,92,.75),transparent)}
.divider i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);margin:0 12px;box-shadow:0 0 9px rgba(201,164,92,.85)}
.title-sub{margin-top:16px;font-family:var(--fell);font-size:clamp(14px,1.9vw,22px);letter-spacing:.5em;text-indent:.5em;color:var(--gold)}
.title-sub.zh{font-family:var(--serif);font-weight:600;letter-spacing:.9em;text-indent:.9em;font-size:clamp(13px,1.7vw,19px)}
.tagline{margin-top:13px;font-family:var(--fell);font-size:12.5px;letter-spacing:.36em;text-indent:.36em;color:rgba(242,231,205,.5)}
.char{opacity:0;display:inline-block;animation:charIn .95s cubic-bezier(.22,.8,.3,1) forwards}
@keyframes charIn{
  0%{opacity:0;filter:blur(10px);transform:translateY(9px)}
  52%{opacity:1;filter:blur(1.5px)}
  60%{opacity:.3}
  71%{opacity:1}
  100%{opacity:1;filter:blur(0);transform:none}
}

/* ---- rune buttons ---- */
.rune-btn{pointer-events:auto;position:relative;background:rgba(156,31,36,.13);border:1px solid rgba(156,31,36,.8);
  color:var(--cream);font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.42em;text-indent:.42em;
  padding:15px 36px;cursor:pointer;transition:all .35s ease}
.rune-btn i{position:absolute;width:9px;height:9px;border:0 solid var(--gold)}
.rune-btn i.c1{top:-1px;left:-1px;border-top-width:1px;border-left-width:1px}
.rune-btn i.c2{top:-1px;right:-1px;border-top-width:1px;border-right-width:1px}
.rune-btn i.c3{bottom:-1px;left:-1px;border-bottom-width:1px;border-left-width:1px}
.rune-btn i.c4{bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px}
.rune-btn:hover{box-shadow:0 0 24px rgba(211,38,47,.5),inset 0 0 16px rgba(211,38,47,.28);border-color:var(--blood-hi);color:#fff}
.rune-btn:active{transform:scale(.97)}
.rune-btn.big{font-size:19px;padding:19px 56px}
.rune-btn.gold{border-color:rgba(201,164,92,.75);background:rgba(201,164,92,.09)}
.rune-btn.gold:hover{box-shadow:0 0 24px rgba(201,164,92,.45),inset 0 0 16px rgba(201,164,92,.25);border-color:var(--gold)}

/* ---- panels ---- */
.gone{opacity:0!important;pointer-events:none!important}
.gone *{pointer-events:none!important}
#idlePanel{position:absolute;bottom:12.5%;left:0;right:0;text-align:center;transition:opacity .7s ease}
#wishPanel{position:absolute;left:50%;bottom:7.5%;transform:translateX(-50%);width:min(580px,88vw);text-align:center;transition:opacity .7s ease}
.guide{font-size:15px;letter-spacing:.3em;text-indent:.3em;color:rgba(242,231,205,.82);margin-bottom:24px}
.ta-wrap{position:relative;padding:4px 6px 13px}
#wishInput{pointer-events:auto;width:100%;background:transparent;border:none;outline:none;resize:none;text-align:center;
  color:var(--cream);font-family:var(--serif);font-size:19px;letter-spacing:.1em;line-height:1.8;caret-color:var(--blood-hi)}
#wishInput::placeholder{color:rgba(242,231,205,.26)}
.underline{position:absolute;left:50%;bottom:0;height:1px;width:32%;transform:translateX(-50%);
  background:rgba(156,31,36,.6);transition:width .55s ease,box-shadow .55s ease}
#wishInput:focus~.underline{width:100%;box-shadow:0 0 14px rgba(211,38,47,.75);background:rgba(211,38,47,.9)}
.rules{margin-top:15px;font-size:11px;letter-spacing:.42em;text-indent:.42em;color:rgba(201,164,92,.55)}
#wishSubmit{margin-top:28px}
#judgePanel{position:absolute;left:0;right:0;bottom:11.5%;text-align:center;transition:opacity .6s ease}
#judgeText{font-size:15px;letter-spacing:.34em;text-indent:.34em;color:rgba(242,231,205,.78);transition:opacity .35s ease}
#pullHint{position:absolute;left:0;right:0;bottom:10.5%;text-align:center;font-size:16px;letter-spacing:.5em;text-indent:.5em;
  color:rgba(242,231,205,.88);transition:opacity .5s ease}
#pullHint .arr{display:inline-block;color:var(--blood-hi);text-shadow:0 0 12px rgba(211,38,47,.8);margin:0 .4em}
#pullHint .arr.l{animation:arrL 1.15s ease-in-out infinite}
#pullHint .arr.r{animation:arrR 1.15s ease-in-out infinite}
@keyframes arrL{0%,100%{transform:translateX(0)}50%{transform:translateX(-13px)}}
@keyframes arrR{0%,100%{transform:translateX(0)}50%{transform:translateX(13px)}}

/* ---- result ---- */
#resultPanel{position:absolute;left:50%;top:44%;transform:translate(-50%,0);width:min(700px,89vw);text-align:center;transition:opacity .8s ease}
#wisherNo{font-size:12px;letter-spacing:.4em;text-indent:.4em;color:var(--gold);margin-bottom:20px}
#resultTitle{font-weight:900;font-size:clamp(32px,5.4vw,60px);letter-spacing:.42em;text-indent:.42em;margin-bottom:28px;white-space:nowrap}
#resultTitle.en{font-family:var(--fell);font-weight:400;letter-spacing:.22em;text-indent:.22em;font-size:clamp(24px,4.4vw,48px)}
#resultTitle.good{color:#e9cd84;text-shadow:0 0 34px rgba(201,164,92,.6)}
#resultTitle.twist{color:var(--blood-hi);text-shadow:0 0 34px rgba(211,38,47,.65)}
#resultTitle.hold{color:#c2262c;text-shadow:0 0 26px rgba(211,38,47,.5)}
#resultText{font-size:16px;line-height:2.15;letter-spacing:.13em;color:rgba(242,231,205,.93);min-height:4.2em;max-width:58ch;margin:0 auto}
.cursor{display:inline-block;width:1px;height:1.05em;background:var(--blood-hi);vertical-align:-.14em;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#resultBtns{margin-top:36px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
#resultBtns .rune-btn{opacity:0;transform:translateY(12px);transition:opacity .55s ease,transform .55s ease,box-shadow .35s ease}
#resultBtns.show .rune-btn{opacity:1;transform:none}

/* ---- footer / about ---- */
footer{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;padding:0 28px;
  font-size:10.5px;letter-spacing:.2em;color:rgba(242,231,205,.36);z-index:6}
@media(max-width:640px){footer{flex-direction:column;gap:4px;text-align:center;font-size:9px;letter-spacing:.14em;bottom:10px}}
#aboutOverlay{position:fixed;inset:0;background:rgba(5,3,4,.9);display:flex;align-items:center;justify-content:center;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .4s ease}
#aboutOverlay.show{opacity:1;pointer-events:auto}
.about-card{width:min(540px,88vw);border:1px solid rgba(201,164,92,.4);padding:40px 42px;background:#0a0708;text-align:center;position:relative}
.about-card h3{font-size:18px;letter-spacing:.6em;text-indent:.6em;color:var(--gold);margin-bottom:22px;font-weight:600}
.about-card p{font-size:13px;line-height:2.2;letter-spacing:.12em;color:rgba(242,231,205,.8);text-align:justify}
.about-card .rune-btn{margin-top:28px;font-size:13px;padding:11px 28px}
</style>
</head>

function spineAt(side,s,bend,sep){
 var gap=1;var x=side*(gap+s*WL.L);
 var y=8*Math.sin(s*Math.PI*0.9)-10*s*s+(noise1(s*3.1,side*7+3)-.5)*9;

 if(sep>0){var px=side*gap,py=26;var a=-side*sep*0.5;
  var dx=x-px,dy=y-py;x=px+Math.cos(a)*dx-Math.sin(a)*dy;y=py+Math.sin(a)*dx+Math.cos(a)*dy;
  y+=sep*44;x+=side*sep*18}

 for(var i=0;i<=WL.N;i++){var a=arr[Math.max(0,i-1)],b=arr[Math.min(WL.N,i+1)];
  var dx=b.x-a.x,dy=b.y-a.y;var l=Math.hypot(dx,dy)||1;arr[i].nx=-dy/l;arr[i].ny=dx/l}}
function spineLookup(side,s,out){var f=clamp(s,0,1)*WL.N;var j=Math.min(WL.N-1,Math.floor(f));var fr=f-j;

 out.x=lerp(a.x,b.x,fr);out.y=lerp(a.y,b.y,fr);out.nx=lerp(a.nx,b.nx,fr);out.ny=lerp(a.ny,b.ny,fr);return out}

function gripPoint(side){spineLookup(side,0.86,_sp);return{x:_sp.x,y:_sp.y,ang:Math.atan2(_sp.nx,-_sp.ny)}}
function smoothClosedPath(pts){var n=pts.length;ctx.beginPath();
 for(var i=0;i<n;i++){var p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
  var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
  var c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
  if(i===0)ctx.moveTo(p1[0],p1[1]);ctx.bezierCurveTo(c1x,c1y,c2x,c2y,p2[0],p2[1])}
 ctx.closePath()}
function drawFist(side,g){
 // 整体拳头：u 沿枝向外，v 向下；指缝凹槽 + 拇指横压
 ctx.save();ctx.translate(g.x,g.y);ctx.rotate(side*0.3*S.handSink);
 var U=[[30,44],[37,10],[36,-14],[30,-28],[18,-34],[10,-30],[4,-35],[-4,-30],[-12,-33],[-19,-28],[-26,-30],[-33,-21],[-35,-4],[-31,10],[-26,18],[-16,23],[-6,25],[4,23],[12,19],[17,14],[21,26],[28,38]];
 var pts=U.map(function(p){return[side*p[0],p[1]]});
 smoothClosedPath(pts);
 var fg=ctx.createRadialGradient(side*6,-26,6,0,-2,62);
 fg.addColorStop(0,'#f6eee2');fg.addColorStop(.55,'#e4d7c3');fg.addColorStop(1,'#a8987f');
 ctx.fillStyle=fg;ctx.fill();
 ctx.lineWidth=1.4;ctx.strokeStyle='rgba(80,62,46,.4)';ctx.stroke();
 // 指缝凹槽（拳面竖向，随拳形弯曲）
 ctx.lineCap='round';
 [-21,-9,3].forEach(function(u){
  ctx.beginPath();ctx.moveTo(side*u,-21);
  ctx.quadraticCurveTo(side*(u-2.5),-2,side*u,15);
  ctx.lineWidth=2.2;ctx.strokeStyle='rgba(88,68,50,.24)';ctx.stroke();
  ctx.beginPath();ctx.moveTo(side*u,14);ctx.lineTo(side*u,19);
  ctx.lineWidth=2;ctx.strokeStyle='rgba(88,68,50,.28)';ctx.stroke()});
 // 指节高光
 [-24,-13,-1,10].forEach(function(u){
  ctx.beginPath();ctx.arc(side*u,-27,4,0,TAU);
  ctx.fillStyle='rgba(250,244,232,.3)';ctx.fill()});
 // 拇指：与拳头同色系横压，根部压暗"坐"进拳面
 ctx.beginPath();ctx.moveTo(side*19,26);ctx.quadraticCurveTo(side*2,20,side*-10,9);
 ctx.lineWidth=15;ctx.strokeStyle='rgba(88,68,50,.3)';ctx.stroke();
 ctx.beginPath();ctx.moveTo(side*17,24);ctx.quadraticCurveTo(side*1,17,side*-10,7);
 ctx.lineWidth=13;ctx.strokeStyle='#e2d5c1';ctx.stroke();
 ctx.beginPath();ctx.moveTo(side*16,22);ctx.quadraticCurveTo(side*1,15,side*-9,6);
 ctx.lineWidth=5;ctx.strokeStyle='rgba(247,240,230,.5)';ctx.stroke();
 ctx.restore()}
function drawHand(side,front){
 if(S.handRise<=0.01)return;
 var rise=easeO(clamp(S.handRise,0,1));
 var g=gripPoint(side);
 var ax=g.x+side*13,ay=g.y+20+(1-rise)*320+S.handSink*270;
 var alpha=clamp(S.handRise*1.6,0,1)*Math.pow(1-S.handSink,1.2);
 if(alpha<=0.02)return;
 ctx.save();ctx.globalAlpha=alpha;
 if(!front){
  var fistFade=1-smooth(0.55,0.8,S.grip)*0.6;
  ctx.globalAlpha=alpha*fistFade;
  var wx=ax+side*6,wy=ay+8,ex=ax+side*74,ey=ay+270;
  var gg=ctx.createLinearGradient(wx,wy,ex,ey);
  gg.addColorStop(0,'rgba(226,216,202,.7)');gg.addColorStop(.5,'rgba(208,196,180,.32)');gg.addColorStop(1,'rgba(180,168,152,0)');
  ctx.beginPath();
  var dx=ex-wx,dy=ey-wy,l=Math.hypot(dx,dy),px=-dy/l,py=dx/l;
  ctx.moveTo(wx+px*19,wy+py*19);ctx.lineTo(ex+px*25,ey+py*25);ctx.lineTo(ex-px*25,ey-py*25);ctx.lineTo(wx-px*19,wy-py*19);
  ctx.closePath();ctx.fillStyle=gg;ctx.fill();
  var pg=ctx.createRadialGradient(ax-10,ay-11,4,ax,ay,54);
  pg.addColorStop(0,'#f4ece0');pg.addColorStop(.6,'#e2d6c4');pg.addColorStop(1,'#b3a18c');
  ctx.save();ctx.translate(ax,ay);ctx.rotate(side*-0.35);
  ctx.beginPath();ctx.ellipse(0,0,36,28,0,0,TAU);ctx.fillStyle=pg;ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle='rgba(90,72,58,.35)';ctx.stroke();ctx.restore();
 }else{
  var fistA=smooth(0.55,0.8,S.grip),capsA=1-fistA;
  if(capsA>0.02){ctx.save();ctx.globalAlpha=alpha*capsA;
  // 自然手型：中指最长、小指最短；静止带放松弯曲，松开时向外瘫软
  var cum=[0.42,1.7,2.95],rest=[0.3,0.45,0.6];
  var flen=[0.88,1.06,1.0,0.8],fwid=[0.86,1.0,0.95,0.76];
  var limp=side*0.32*S.handSink;
  for(var j=0;j<4;j++){
   var cj=clamp(S.grip*1.5-j*0.14,0,1);
   var kx=g.x-side*(j-1.5)*14,ky=g.y-7;
   var base=-Math.PI/2-side*0.06+side*(j-1.5)*0.11+limp;
   var px0=kx,py0=ky;
   for(var m=0;m<3;m++){
    var curl=clamp(cj*1.35-m*0.2,0,1);
    var cm=rest[m]+(1-rest[m])*curl;
    var th=base+cum[m]*cm+side*-0.16*cm;
    var ln=[30,22,16][m]*flen[j];
    var ex=px0+Math.cos(th)*ln,ey=py0+Math.sin(th)*ln;
    segStroke(px0,py0,ex,ey,[18,16,13.5][m]*fwid[j]);
    px0=ex;py0=ey;
   }
  }
  // 拇指
  var ct=0.3+0.7*clamp(S.grip*1.4-0.25,0,1);
  var tx=ax-side*22,ty=ay-4;
  var th1=-Math.PI/2-side*(0.5-0.22*ct)+limp;
  var t1x=tx+Math.cos(th1)*24,t1y=ty+Math.sin(th1)*24;
  segStroke(tx,ty,t1x,t1y,15);
  var th2=th1-side*1.25*ct;
  segStroke(t1x,t1y,t1x+Math.cos(th2)*17,t1y+Math.sin(th2)*17,13);
  ctx.restore()}
  if(fistA>0.02){ctx.save();ctx.globalAlpha=alpha*fistA;drawFist(side,g);ctx.restore()}
 }
 ctx.restore()}
function segStroke(x0,y0,x1,y1,w){
 ctx.lineCap='round';

 var dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy)||1,px=-dy/l,py=dx/l;
 ctx.beginPath();ctx.moveTo(x0-px*2,y0-py*2);ctx.lineTo(x1-px*2,y1-py*2);ctx.lineWidth=w*0.38;

   ctx.lineWidth=st.wid[i];ctx.strokeStyle=st.col[i];ctx.stroke()}}}
function drawVessels(dx,tintPrefix,mul){if(S.vessel<=0.01)return;
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
 [-1,1].forEach(function(side){var SD=WL.sides[side];
  SD.vstrands.forEach(function(st,vi){var thr=0.60-0.08*Math.sin(tG*1.9+vi*2.1+side);
   for(var i=1;i<=WL.N;i++){if(st.ves[i]>thr&&st.ves[i-1]>thr-0.06){
    var a=clamp((st.ves[i]-thr)/(1-thr),0,1)*S.vessel*mul;if(a<=0.02)continue;

function resetScene(){S.sep=0;S.bend=0;S.bendVel=0;S.bendTarget=0;S.grip=0;S.handRise=0;S.handSink=0;
 S.vessel=0;S.dustConverge=0;S.flash=0;S.trauma=0;S.aberr=0;S.pulse=0;S.resT=0;S.branchShow=0;S.branchAlpha=1;
 S.boxAlpha=1;S.boxY=0;S.verdict=null;S.pullHeld=false;S.pullPointer=-1;S.attempts=0;S.softHold=false;
 S.camT={z:1,x:0,y:34};S.cam={z:1,x:0,y:34};debris.length=0;embers.length=0;$('#wishInput').value=''}
function enter(st){S.state=st;S.st=0;
 switch(st){
  case 'idle':resetScene();showPanels('title','idle');applyTitle();break;
  case 'reveal':showPanels();break;
  case 'wish':showPanels('wish');break;
  case 'judging':showPanels('judge');S.judgeDur=rand(2.5,4);S.carT=1.3;S.carIdx=0;S.nextBeat=0;
   $('#judgeText').style.opacity=1;$('#judgeText').textContent=L[lang].judging[0];AudioSys.duck(true);break;
  case 'pull':showPanels('pull');S.pullMode=(S.verdict.result==='refuse')?'refuse':'snap';
   S.attempts=0;S.attemptLatch=false;S.maxHold=0;AudioSys.creakStart();break;
  case 'snap':showPanels();break;
  case 'refuse':showPanels();break;
  case 'result':showPanels('result');fillResultDOM(true);AudioSys.restore();break;
  case 'again':showPanels();break;
  case 'restart':showPanels();AudioSys.restore();break;
 }}
function doSnap(){enter('snap');S.slowT=0.35;S.timeScale=0.25;
 S.flash=1;S.flashColor=S.verdict.result==='good'?'#ffd98a':'#e03038';
 S.trauma=1;S.aberr=3;S.pulse=1;S.vessel=1;
 AudioSys.creakStop();AudioSys.crack();AudioSys.splinter();AudioSys.cutReturn();
 spawnDebris();if(S.verdict.result==='twist')spawnEmbers()}
function doRefuse(){enter('refuse');S.softHold=false;S.trauma=0.85;S.vessel=1;
 AudioSys.creakStop();AudioSys.thud();AudioSys.slowDown()}
function doHold(){enter('refuse');S.softHold=true;AudioSys.creakStop()}
function update(sdt,rdt){
 S.par.x=lerp(S.par.x,S.mouse.x,1-Math.exp(-rdt*3));S.par.y=lerp(S.par.y,S.mouse.y,1-Math.exp(-rdt*3));
 S.cam.z=lerp(S.cam.z,S.camT.z,1-Math.exp(-rdt*2.4));
 S.cam.x=lerp(S.cam.x,S.camT.x,1-Math.exp(-rdt*2.4));
 S.cam.y=lerp(S.cam.y,S.camT.y,1-Math.exp(-rdt*2.4));
 S.trauma=Math.max(0,S.trauma-rdt*1.5);
 S.flash=Math.max(0,S.flash-sdt*2.4);
 S.aberr=Math.max(0,S.aberr-rdt*7);
 S.pulse=Math.max(0,S.pulse-sdt*1.8);
 if(S.state!=='judging')S.dustConverge=Math.max(0,S.dustConverge-sdt*2);
 updateParticles(sdt);
 switch(S.state){
  case 'idle':S.camT.z=1;S.camT.y=34;break;
  case 'reveal':{var e=easeIO(clamp(S.st/2.8,0,1));
   S.branchShow=smooth(0.04,0.6,e);
   S.boxY=smooth(0.42,1,e)*250;S.boxAlpha=1-smooth(0.5,0.95,e);
   S.handRise=smooth(0.4,0.78,e);S.grip=smooth(0.74,1,e);
   S.camT.z=lerp(1,1.32,e);S.camT.y=lerp(34,-4,e);
   if(S.st>=2.85)enter('wish');break}
  case 'wish':S.bobY=Math.sin(tG*0.9)*3;S.vessel=0.06+0.03*Math.sin(tG*1.4);
   S.camT.z=1.32;S.camT.y=-4;break;
  case 'judging':{var p=clamp(S.st/S.judgeDur,0,1);
   S.vessel=0.3+0.2*Math.sin(S.st*3.2)+p*0.2;
   S.dustConverge=smooth(0,0.7,p);
   S.camT.z=1.32+0.12*p;
   S.nextBeat-=sdt;if(S.nextBeat<=0){AudioSys.beat();S.nextBeat=60/(60+30*p)}
   S.carT-=sdt;if(S.carT<=0){S.carT=1.35;S.carIdx++;var jt=$('#judgeText');jt.style.opacity=0;
    setTimeout(function(){if(S.state==='judging'){jt.textContent=L[lang].judging[S.carIdx%3];jt.style.opacity=1}},280)}
   S.bobY=Math.sin(tG*0.9)*2;
   if(S.st>=S.judgeDur){S.dustConverge=0;
    if(S.verdict.result==='praise')doHold();else enter('pull')}
   break}
  case 'pull':{
   if(S.pullHeld){S.bend+=(S.bendTarget-S.bend)*(1-Math.exp(-sdt*16))}
   else{S.bendVel+=(-150*S.bend-8.5*S.bendVel)*sdt;S.bend+=S.bendVel*sdt;
    if(S.bend<0.002&&Math.abs(S.bendVel)<0.02){S.bend=0;S.bendVel=0}}
   S.bend=Math.max(0,S.bend);
   S.vessel=0.4+S.bend*0.6;
   AudioSys.creakLevel(S.bend);
   if(S.bend>0.15)S.trauma=Math.max(S.trauma,S.bend*0.3);
   S.camT.z=1.5-S.bend*0.05;S.camT.y=-4;
   if(S.pullMode==='snap'){if(S.bend>=1)doSnap()}
   else{var capRaw=Math.pow(0.86,1/1.4);
    if(S.pullHeld&&S.rawPull>=capRaw){S.maxHold+=sdt;
     if(S.maxHold>0.3&&!S.attemptLatch){S.attemptLatch=true;S.attempts++;
      if(S.attempts>=2)doRefuse();else AudioSys.thud()}}
    else S.maxHold=0}
   break}
  case 'snap':{
   S.sep=Math.min(1,S.st*2.6);
   S.bend=lerp(S.bend,0.3,1-Math.exp(-sdt*5));
   S.grip=Math.max(0,1-S.st*2.4);
   S.handSink=smooth(0.3,1.1,S.st);
   S.vessel=Math.max(0,S.vessel-sdt*1.1);
   S.camT.z=1.28;S.camT.y=10;
   if(S.st>2.3){S.resultKind='snap';enter('result')}
   break}
  case 'refuse':{var soft=S.softHold;
   if(S.st<0.9&&!soft)S.vessel=(noise1(S.st*30,5)>0.42?0.55:0.12)*(1-S.st/0.9);
   else S.vessel=Math.max(0,S.vessel-sdt*(soft?0.5:2));
   S.bend=lerp(S.bend,0,1-Math.exp(-sdt*4));
   S.grip=Math.max(0,S.grip-sdt*1.1);
   S.handSink=smooth(soft?0.2:0.5,1.6,S.st);
   S.camT.z=1.24;S.camT.y=6;
   if(S.st>(soft?1.9:2.2)){S.resultKind='hold';enter('result')}
   break}
  case 'result':S.resT=Math.min(1,S.st*1.3);S.bobY=Math.sin(tG*0.8)*3;
   if(S.verdict&&S.verdict.result==='twist')S.vessel=0.1+0.06*Math.sin(tG*2);else S.vessel=Math.max(0,S.vessel-sdt);
   S.camT.z=1.15;S.camT.y=-20;break;
  case 'again':{var p2=clamp(S.st/1.5,0,1),e2=easeIO(p2);
   S.resT=1-e2;S.handSink=1-e2;S.grip=smooth(0.5,1,p2);
   S.vessel=p2<0.75?smooth(0.1,0.5,p2)*0.9:0.9*(1-smooth(0.75,1,p2));
   S.camT.z=1.32;S.camT.y=-4;
   if(p2>=1)enter('wish');break}
  case 'restart':{var p3=clamp(S.st/2.2,0,1),e3=easeIO(p3);
   S.resT=1-e3;S.branchShow=1-smooth(0.25,0.8,e3);
   S.boxAlpha=smooth(0.35,0.8,e3);S.boxY=250*(1-smooth(0.35,0.9,e3));
   S.grip=Math.max(0,S.grip-e3*1.5);S.handRise=1-smooth(0.1,0.5,e3);S.handSink=0;
   S.vessel=Math.max(0,S.vessel-sdt*2);
   S.camT.z=lerp(1.2,1,e3);S.camT.y=lerp(-10,34,e3);
   if(p3>=1)enter('idle');break}
 }}
